name: keepalive

# Render free instances sleep after 15 min without inbound traffic. Pinging /healthz every
# 5 minutes keeps the wall awake and also touches Supabase so the free project stays active.
# /healthz is public and returns only {"ok":true}.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        run: |
          curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 \
            https://grokbot-wall-9p2y.onrender.com/healthz
